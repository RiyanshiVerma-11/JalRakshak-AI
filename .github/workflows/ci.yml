name: JalRakshak AI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Set up AWS SAM CLI
      uses: aws-actions/setup-sam@v2
      with:
        use-installer: true

    - name: Validate AWS SAM Template
      run: |
        sam validate --template aws_infra/template.yaml --region ap-south-1 --lint

    - name: Run Test Suite (Integration & AWS Cedar RBAC)
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v

    - name: Run Strands Agent Benchmark (Non-blocking)
      continue-on-error: true
      env:
        PYTHONPATH: .
      run: |
        python tests/benchmark_strands.py

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build Frontend Application
      run: |
        cd frontend
        npm ci
        npm run build
