version: '3.8'

# =============================================================================
# JalRakshak AI — Unified AWS Open-Source Emulation & Analytics Stack
# Provides genuine AWS Open-Source Tooling for "BUILD IT" Hackathon Evaluation:
# 1. LocalStack (S3, DynamoDB, SNS, EventBridge)
# 2. AWS OpenSearch 2.x (Hydrological SCADA Telemetry & Citizen Incident DSL)
# 3. AWS OpenSearch Dashboards (Real-Time Sensor Telemetry Visualizer)
# Completely free of cost with zero AWS cloud credentials / billing required.
# =============================================================================

services:
  # ── LocalStack Gateway & AWS Cloud Emulation ───────────────────────────────
  localstack:
    image: localstack/localstack:3.8
    container_name: jalrakshak-localstack
    ports:
      - "4566:4566"            # LocalStack unified edge gateway
      - "4510-4559:4510-4559"  # Service port range
    environment:
      - SERVICES=s3,dynamodb,sns,events
      - AWS_DEFAULT_REGION=ap-south-1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=0
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AWS OpenSearch 2.x Telemetry & Anomaly Analytics Cluster ──────────────
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: jalrakshak-opensearch
    environment:
      - cluster.name=jalrakshak-telemetry-cluster
      - node.name=jalrakshak-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "plugins.security.disabled=true"  # Frictionless local evaluation without SSL cert hurdles
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"            # OpenSearch REST HTTP gateway
      - "9600:9600"            # Performance analyzer
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── AWS OpenSearch Dashboards (Sensor Telemetry UI) ───────────────────────
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: jalrakshak-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      opensearch:
        condition: service_healthy

  # ── JalRakshak AI Full Application Container ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jalrakshak-app
    depends_on:
      localstack:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      - AWS_EXECUTION_MODE=LOCALSTACK
      - AWS_ENDPOINT_URL=http://localstack:4566
      - OPENSEARCH_URL=http://opensearch:9200
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - EVENTBRIDGE_BUS=jalrakshak-emergency-eventbus
      - SNS_TOPIC_ARN=arn:aws:sns:ap-south-1:000000000000:JalRakshak-Alerts-Multilingual
      - EVIDENCE_BUCKET=jalrakshak-evidence-lake
      - PORT=8004
      - HOST=0.0.0.0
